packages:
  - "apps/*"
  - "apps/*/*"
  - "packages/*"
  - "packages/*/*"
  - "packages/*/*/*"

catalogMode: strict

catalog:
  "@types/node": "26.6.1"
  cspell: "10.3.3"
  jsdom: "28.0.0"
  markdownlint-cli: "0.49.1"
  rxjs: "7.8.2"
  stylelint: "17.15.0"
  stylelint-config-standard: "40.0.0"
  tslib: "2.8.1"
  typescript: "6.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  vitest: 5.0.1

catalogs:
  angular:
    "@angular/common": "22.2.0"
    "@angular/compiler": "22.2.0"
    "@angular/core": "22.2.0"
    "@angular/forms": "22.2.0"
    "@angular/platform-browser": "22.2.0"
    "@angular/router": "22.2.0"
    "@angular/build": "22.2.0"
    "@angular/cli": "22.2.0"
    "@angular/compiler-cli": "22.2.0"

overrides:
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

nodeVersion: "26.9.0"
engineStrict: true
minimumReleaseAge: 2880

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@angular-devkit/architect@0.2202.0"
  - "@angular-devkit/core@22.2.0"
  - "@angular-devkit/schematics@22.2.0"
  - "@angular/build@22.2.0"
  - "@angular/cli@22.2.0"
  - "@angular/common@22.2.0"
  - "@angular/compiler-cli@22.2.0"
  - "@angular/compiler@22.2.0"
  - "@angular/core@22.2.0"
  - "@angular/forms@22.2.0"
  - "@angular/platform-browser@22.2.0"
  - "@angular/router@22.2.0"
  - "@schematics/angular@22.2.0"
