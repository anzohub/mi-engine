packages:
  - "apps/*"
  - "apps/*/*"
  - "packages/*"
  - "packages/*/*"
  - "packages/*/*/*"

catalogMode: strict

catalog:
  "@types/node": "26.6.1"
  cspell: "10.3.3"
  jsdom: "28.0.0"
  markdownlint-cli: "0.49.1"
  rxjs: "7.8.2"
  stylelint: "17.15.0"
  stylelint-config-standard: "40.0.0"
  tslib: "2.8.1"
  typescript: "6.0.2"
  vite: "npm:@voidzero-dev/vite-plus-core@0.3.3"
  vite-plus: "0.3.3"
  vitest: "4.1.11"

catalogs:
  angular:
    "@angular/common": "22.1.7"
    "@angular/compiler": "22.1.7"
    "@angular/core": "22.1.7"
    "@angular/forms": "22.1.7"
    "@angular/platform-browser": "22.1.7"
    "@angular/router": "22.1.7"
    "@angular/build": "22.1.8"
    "@angular/cli": "22.1.8"
    "@angular/compiler-cli": "22.1.7"

overrides:
  "vite@*": "catalog:"
  "vitest@*": "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

nodeVersion: "26.9.0"
engineStrict: true
minimumReleaseAge: 2880

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
